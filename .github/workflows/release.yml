name: Build and release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Install plugin build dependencies
        working-directory: obsidian-markdown-quiz
        run: pnpm install --frozen-lockfile
      - name: Build and check plugin
        working-directory: obsidian-markdown-quiz
        run: |
          pnpm build
          pnpm test
      - name: Package downloads
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-quiz-downloads
          path: |
            dist/*.zip
            plugin/markdown-quiz-generator/*
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json, os; assert json.load(open('obsidian-markdown-quiz/manifest.json'))['version'] == os.environ['GITHUB_REF_NAME'], 'Tag must match manifest version'"
          gh release create "$GITHUB_REF_NAME" dist/*.zip plugin/markdown-quiz-generator/main.js plugin/markdown-quiz-generator/manifest.json plugin/markdown-quiz-generator/styles.css --generate-notes
